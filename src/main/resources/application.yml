spring:
  application:
    name: library

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:25432/library}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  app:
    security:
      enabled: true

  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html
      operationsSorter: method
      tagsSorter: alpha
      try-it-out-enabled: true
      persist-authorization: true
    show-actuator: false
    paths-to-match: /api/**


jwt:
  secret: ${JWT_SECRET:-your-super-secret-key-that-is-at-least-32-characters-long}
  ttl: ${JWT_TTL:3600}
  refresh-ttl: ${JWT_REFRESH_TTL:86400}