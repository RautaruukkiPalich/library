spring:
  application:
    name: library

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jwt:
    secret: ${JWT_SECRET:-your-super-secret-key-that-is-at-least-32-characters-long}
    ttl: ${JWT_TTL:3600}
    refresh-ttl: ${JWT_REFRESH_TTL:86400}

  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html
      operationsSorter: method
      tagsSorter: alpha
      try-it-out-enabled: true
      persist-authorization: true
    show-actuator: false
    paths-to-match: /api/**