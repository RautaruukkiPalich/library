spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.test.database.replace=none
spring.main.allow-bean-definition-overriding=true

logging.level.root=OFF
logging.level.com.app=OFF
logging.level.org.springframework=ERROR

#logging.level.root=INFO
#logging.level.com.app=INFO
#logging.level.org.springframework=INFO

jwt.secret=${JWT_SECRET:-your-super-secret-key-that-is-at-least-32-characters-long}
jwt.ttl=${JWT_TTL:3600}
jwt.refresh-ttl=${JWT_REFRESH_TTL:86400}

app.security.enabled=false
app.aop.roles.enabled=false